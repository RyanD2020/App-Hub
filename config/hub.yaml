# ---------------------------------------------------------------- Ideas for your team
# team: a team id from the teams list. The Ideas filter shows the teams that have ideas, in nav_order.
# proof: the id of a tool that already works the same way, or blank for "New for us".
ideas:
  - team: "accounting"
    task: "Matching vendor invoices to contracts"
    today: "Someone opens each invoice and checks every line against the agreement."
    tool_could: "Read the invoice, match each line to its contract terms, and flag only what doesn't fit."
    proof: "accruals"
  - team: "accounting"
    task: "Chasing fees that were never billed"
    today: "Missing charges are spotted late, if at all, by comparing lists by hand."
    tool_could: "List every fee due in the period that hasn't been invoiced, and draft the follow-up email."
    proof: "accruals"
  - team: "accounting"
    task: "Explaining month-end movements"
    today: "Analysts rebuild the same rollforward each month to explain what changed."
    tool_could: "Produce the rollforward automatically and show which items explain each difference."
    proof: "accruals"
  - team: "accounting"
    task: "Reconciling two systems every day"
    today: "Two exports are lined up in a spreadsheet and totals compared by eye."
    tool_could: "Load both exports, compare them by day, and show only the days that don't tie."
    proof: "cadency"
  - team: "all_ia"
    task: "Planning a new project from scratch"
    today: "Each project starts with a blank document and a lot of searching."
    tool_could: "Turn a description and a few documents into a step-by-step plan."
    proof: "coach"
  - team: "underwriting"
    task: "Comparing two versions of a contract"
    today: "Reviewers read both versions side by side to find what changed."
    tool_could: "Compare the versions automatically and point to every change that matters."
    proof: "bracket"
  - team: "underwriting"
    task: "Checking defined terms and cross-references"
    today: "Someone checks by hand that every defined term is defined and every section reference exists."
    tool_could: "Scan the document and list undefined terms and broken references with their location."
    proof: "bracket"
  - team: "svio"
    task: "Tracking a deal from proposal to funding"
    today: "Status lives in emails and spreadsheets, so updates mean asking around."
    tool_could: "Keep one record per deal, with each stage, document and date in one place."
    proof: "svio"
  - team: "stable_value_investments"
    task: "Building the same client report every month"
    today: "Figures are copied into the same slides by hand each month."
    tool_could: "Generate the branded report from live data in one click."
    proof: ""
  - team: "svio"
    task: "Tracking key contract dates and notices"
    today: "Deadlines are tracked in calendars and memory, and some get missed."
    tool_could: "Pull key dates from each record and email reminders before they're due."
    proof: "svio"
  - team: "accounting"
    task: "Pulling audit evidence together"
    today: "Evidence is gathered from inboxes and shared drives when the auditors ask."
    tool_could: "Track each request, collect the evidence as it's produced, and export it as one package."
    proof: "accruals"
  - team: "underwriting"
    task: "Checking documents for missing items"
    today: "Reviewers work through a checklist for every document by hand."
    tool_could: "Run the checklist automatically and show which items are missing."
    proof: "bracket"

# ---------------------------------------------------------------- Built on Databricks
platform:
  layers:
    - {title: "Databricks Apps", text: "The front door. People open a link and use the tool, with nothing to install.", feature: "Databricks Apps"}
    - {title: "Unity Catalog", text: "Governance. Controls who can see which data, and records who changed it.", feature: "Unity Catalog"}
    - {title: "Delta tables", text: "The data. Reliable tables with a full history of every change.", feature: "Delta tables"}
    - {title: "Git deployment", text: "Delivery. Every change is versioned, reviewed and redeployed in minutes.", feature: "Git deployment"}
  features: ["Databricks Apps", "Git deployment", "Delta tables", "Unity Catalog", "Databricks SQL", "AI models"]
  # Per tool: yes or planned. A feature that isn't listed is blank.
  matrix:
    bracket: {"Databricks Apps": "yes", "Git deployment": "yes"}
    accruals: {"Databricks Apps": "planned", "Git deployment": "yes", "Delta tables": "planned", "Databricks SQL": "planned"}
    cadency: {"Databricks Apps": "yes", "Git deployment": "yes"}
    svio: {"Databricks Apps": "yes", "Git deployment": "yes", "Delta tables": "yes", "Unity Catalog": "yes", "Databricks SQL": "yes"}
    coach: {"Databricks Apps": "yes", "AI models": "yes"}
  # Chip beside the matrix heading. Blank it once every row is confirmed.
  matrix_note: "Confirm each row"
  next:
    - {eyebrow: "Documents", title: "Turn PDFs into data", text: "Pull names, dates and amounts out of documents automatically and store them as a table, with a person reviewing anything unclear."}
    - {eyebrow: "Questions", title: "Ask data in plain English", text: 'Type a question like "funded amount by state this year" and get a chart, with the query shown so it can be checked.'}
    - {eyebrow: "Automation", title: "Jobs that run overnight", text: "Scheduled checks that run without anyone pressing a button, and email the team when something needs attention."}
    - {eyebrow: "History", title: "See any table as it was", text: "Look at data exactly as it stood on any past date, and see which rows changed in between."}
    - {eyebrow: "Traceability", title: "Trace a number to its source", text: "Follow any figure in a report back through every step to the file it came from."}
    - {eyebrow: "Cost", title: "Know what everything costs", text: "See platform spend by team and project, and spot anything running that doesn't need to be."}

