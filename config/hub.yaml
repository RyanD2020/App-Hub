# App hub content and settings. Everything here can be changed without touching the code.
# Content is copied from docs/App_Hub_Prototype.html (the approved design).
# Strings are double-quoted so punctuation never changes their meaning. To check this file after an edit, run
# tests/run_tests.py in Databricks (tests/test_config.py parses and validates it).

# ---------------------------------------------------------------- teams
# Every team the hub knows, one navigation section each, in nav_order (lowest first).
# id: lowercase letters, digits and underscores. It is the team's folder under tools/ (tools/<id>/) and what each
# tool's team and each idea's team below refer to. name: shown in the Team tools menu, the Ideas filter and the
# Request a tool dropdown (which adds "Other" after these).
teams:
  - {id: "all_ia", name: "All of IA", nav_order: 1}
  - {id: "underwriting", name: "Underwriting", nav_order: 2}
  - {id: "svio", name: "SVIO", nav_order: 3}
  - {id: "accounting", name: "Accounting", nav_order: 4}
  - {id: "structured_settlements", name: "Structured Settlements", nav_order: 5}
  - {id: "stable_value_investments", name: "Stable Value Investments", nav_order: 6}
  - {id: "par", name: "PAR", nav_order: 7}
  - {id: "guaranteed_products", name: "Guaranteed Products", nav_order: 8}
  - {id: "prt", name: "PRT", nav_order: 9}
  - {id: "service", name: "Service", nav_order: 10}

# ---------------------------------------------------------------- tools
# id: lowercase letters, digits and underscores; also the tool's page address in the hub (/<id>).
# team: a team id from the list above.
# mode: how the hub opens the tool.
#   embedded: the tool runs as a page inside the hub. module is the dotted path of its page.py, for example
#             "tools.underwriting.bracket_spell_check.page", and url stays blank. See docs/ADDING_A_TOOL.md.
#   external: the tool is its own Databricks App and opens in a new tab. url is its link; leave it blank and the
#             tool shows "Link coming soon" instead of an Open button.
# status_chip: live (green with the pulsing dot), match (green), review (orange), info (blue) or plain (outline).
# checks: "Rules-based code" or "AI-assisted".
# app_name: the Databricks App name, used later for live status (Part 4, off until enabled). Leave blank for now.
# chart_hours: [before, after] hours per month, drawn on the Home chart.
# stats flag: team (shows "Team figure"), placeholder (shows "Placeholder") or measured (no chip).
tools:
  - id: "bracket"
    name: "Bracket Counter & Spell Check"
    short_name: "Bracket & Spell Check"
    category: "Contracts"
    status: "Live"
    status_chip: "live"
    checks: "Rules-based code"
    team: "underwriting"
    mode: "external"
    url: "https://bracket-app-3267307435697917.aws.databricksapps.com"
    app_name: ""
    win: "95% less time on contract review"
    summary: "Compares the redlined and clean versions of a Stable Value contract, finds every unmatched bracket, and checks spelling against a legal word list."
    before: "Reviewers counted every bracket by hand across both versions of each contract, then read through again looking for typos."
    after: "Upload both versions. The app compares bracket counts, points to each mismatch with its section and surrounding text, runs an offline spell check, and produces a Word or PDF report."
    stats:
      - {value: "95%", label: "less review time", flag: "team"}
      - {value: "100", label: "errors caught", flag: "team"}
      - {value: "$0", label: "added software cost", flag: "team"}
      - {value: "4", label: "team members using it", flag: "team"}
    steps:
      - "Upload the redlined and clean versions"
      - "Brackets are counted and paired in both"
      - "Mismatches are shown with where they sit"
      - "Spelling is checked against legal terms"
      - "Download the summary report"
    built_with: ["Databricks Apps", "Git deployment", "Python", "Streamlit"]
    chart_hours: [20, 1]

  - id: "accruals"
    name: "Citi Accruals"
    short_name: "Citi Accruals"
    category: "Finance"
    status: "Live"
    status_chip: "live"
    checks: "Rules-based code"
    team: "underwriting"
    mode: "external"
    url: "https://citiaccruals-3267307435697917.aws.databricksapps.com"
    app_name: ""
    win: "Every invoice line matched to its fee"
    summary: "Matches Citi invoices to funding agreement fee schedules, tracks approval and payment, and produces the month-end accrual with a full bridge to the tracker."
    before: "Fees were tracked in a spreadsheet, each Citi invoice was matched line by line by hand, and the month-end rollforward was built manually."
    after: "Upload the invoice PDF. Each line is marked Match, Review or No match, unbilled fees are flagged, and month-end produces the rollforward, the tracker bridge and a ready-to-send follow-up email."
    stats:
      - {value: "12 to 2", label: "hours per month-end", flag: "placeholder"}
      - {value: "Every line", label: "checked against its fee schedule", flag: "measured"}
      - {value: "Zero", label: "unexplained difference to the tracker", flag: "measured"}
    steps:
      - "Upload the Citi invoice"
      - "Lines are matched to fee schedules"
      - "A reviewer resolves anything flagged"
      - "Approval and payment are recorded"
      - "Month-end reports are produced"
    built_with: ["Databricks", "Python", "Streamlit", "Excel reports"]
    chart_hours: [12, 2]

  - id: "cadency"
    name: "Cadency to SAP reconciliation"
    short_name: "Cadency recon"
    category: "Reconciliation"
    status: "Phase 3 in build"
    status_chip: "match"
    checks: "Rules-based code"
    team: "accounting"
    mode: "external"
    url: "https://fastreconciler-3267307435697917.aws.databricksapps.com"
    app_name: ""
    win: "Cadency and SAP checked every day"
    summary: "Reconciles Cadency against SAP and the bank every day: FAST activity to SAP in phase 1, each bank flow code in phase 2, and reclaim transactions in phase 3."
    before: "Each day's FAST activity was compared against SAP by hand, and finding a difference meant digging through both exports."
    after: "Load the Cadency, SAP and bank exports. Totals are compared by day and by bank flow code, every check is marked reconciles or does not reconcile, and any difference is shown with its amount."
    stats:
      - {value: "15 to 3", label: "hours per month on daily checks", flag: "placeholder"}
      - {value: "Validated", label: "on real Cadency and SAP data", flag: "measured"}
      - {value: "8", label: "bank flow codes checked separately each day", flag: "measured"}
    steps:
      - "Load the Cadency, SAP and bank exports"
      - "FAST activity is compared to SAP by day"
      - "Each bank flow code is checked on its own"
      - "Reclaim transactions are netted against their accounts"
      - "Differences are exported for follow-up"
    built_with: ["Databricks Apps", "Git deployment", "Python", "Streamlit"]
    chart_hours: [15, 3]

  - id: "svio"
    name: "SVIO plan database"
    short_name: "SVIO"
    category: "Data"
    status: "Pilot"
    status_chip: "info"
    checks: "Rules-based code"
    team: "svio"
    mode: "external"
    url: "https://svio-coda-app-3267307435697917.aws.databricksapps.com"
    app_name: ""
    win: "One governed record per plan"
    summary: "Keeps one record per plan in Unity Catalog, tracking contract receipt, W-9, approval and funding, with every edit and deletion recorded."
    before: "Plan and contract details were kept across separate files, so checking a plan's status meant finding the latest version first."
    after: "Each plan has one record in a governed table. Contract details, background forms and status live together, and every change records who made it and when."
    stats:
      - {value: "8 to 2", label: "hours per month on plan tracking", flag: "placeholder"}
      - {value: "1", label: "governed record per plan", flag: "measured"}
      - {value: "Every edit", label: "recorded with who and when", flag: "measured"}
    steps:
      - "Add or find a plan"
      - "Attach the contract and background forms"
      - "Update status as the plan moves"
      - "Every change is logged"
      - "Deleted records can be reviewed and restored"
    built_with: ["Databricks Apps", "Delta tables", "Unity Catalog", "Databricks SQL"]
    chart_hours: [8, 2]

  - id: "coach"
    name: "Project Coach"
    short_name: "Project Coach"
    category: "AI assistant"
    status: "Final edits"
    status_chip: "review"
    checks: "AI-assisted"
    team: "all_ia"
    mode: "external"
    url: "https://project-coach-3267307435697917.aws.databricksapps.com"
    app_name: ""
    win: "From idea to plan, step by step"
    summary: "Turns a project idea and its documents into a plan, then coaches you through each step in its own conversation."
    before: "Every project started from a blank page, with planning and research done from scratch each time."
    after: "Describe the project and attach PDFs, Word or Excel files. The coach builds a plan and works through each step with you, and you can share more documents at any point."
    stats:
      - {value: "6 to 2", label: "hours to plan a new project", flag: "placeholder"}
      - {value: "6", label: "file types the coach can read", flag: "measured"}
      - {value: "Every step", label: "has its own coaching chat", flag: "measured"}
    steps:
      - "Describe the project"
      - "Attach any documents"
      - "Review the generated plan"
      - "Work through each step with the coach"
      - "Share new files as you go"
    built_with: ["Databricks Apps", "Python", "Streamlit", "AI models"]
    chart_hours: [6, 2]

